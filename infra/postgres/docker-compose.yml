services:
  postgres:
    image: postgres:16-alpine
    container_name: maxsas-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Maxsas123
      POSTGRES_DB: maxsas_dev
    ports:
      - "5432:5432"
    volumes:
      - maxsas_backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maxsas_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maxsas_backend_postgres_data: