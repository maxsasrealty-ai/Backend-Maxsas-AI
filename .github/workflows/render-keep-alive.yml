name: VPS Backend Health Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: vps-backend-health
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VPS health endpoint
        run: >-
          curl --fail --silent --show-error
          --max-time 30
          --retry 2
          --retry-delay 5
          http://135.125.222.22:4000/health